<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch - Shadow Anime</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<nav>
    <div class="logo">SHADOW ANIME</div>

    <ul id="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="anime.html">Anime</a></li>
        <li><a href="movies.html">Movies</a></li>
        <li><a href="popular.html">Popular</a></li>
        <li><a href="manga.html">Manga</a></li>
        <li><a href="community.html">Community</a></li>
        <li><a href="watchlist.html">Watchlist</a></li>
        <script type="module" src="user-auth.js"></script>
    </ul>

    <div class="menu-btn" id="menuBtn">☰</div>
</nav>

<section class="watch-page">

    <div class="watch-header">
        <div>
            <span class="details-tag">NOW WATCHING</span>
            <h1 id="watchTitle">Loading Anime...</h1>
            <p id="watchMeta">Episode loading...</p>
        </div>

        <button onclick="goBackDetails()" class="trailer-btn">
            Back To Details
        </button>
    </div>

    <div class="watch-layout">

        <div class="video-box">
            <video id="videoPlayer" controls autoplay></video>
        </div>

        <div class="episode-side">
            <h2>Episodes</h2>

            <input id="watchEpisodeSearch"
                   placeholder="Search episode..."
                   class="episode-search">

            <div id="watchEpisodeList"></div>
        </div>

    </div>

    <div class="watch-controls">
        <button id="prevWatchBtn">Previous Episode</button>
        <button id="nextWatchBtn">Next Episode</button>
        <button onclick="skipIntro()">Skip Intro</button>
        <button onclick="toggleTheater()">Theater Mode</button>
        <button onclick="addWatchlist()">Add Watchlist</button>
    </div>

</section>

<footer>
    © 2026 Shadow Anime
</footer>

<script src="script.js"></script>
<script type="module" src="protect.js"></script>

</body>
</html>
