<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadow Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>SHADOW</h2>

    <a class="active" href="admin-dashboard.html">
        Dashboard
    </a>

    <a href="admin-anime.html">
        Anime Manager
    </a>

    <a href="admin-movies.html">
        Movies
    </a>

    <a href="admin-users.html">
        Users
    </a>

    <a href="admin-settings.html">
        Settings
    </a>

    <a href="index.html">
        Back To Website
    </a>
    <a href="admin-manga.html">Manga</a>

</div>

<!-- MAIN -->

<div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

        <h1>Admin Dashboard</h1>

        <button onclick="clearAll()">
            Clear All
        </button>

    </div>

    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <h3 id="totalAnime">0</h3>

            <p>Total Anime</p>

        </div>

        <div class="stat-card">

            <h3 id="totalMovies">0</h3>

            <p>Total Movies</p>

        </div>

        <div class="stat-card">

            <h3 id="totalUsers">0</h3>

            <p>Total Users</p>

        </div>

        <div class="stat-card">

            <h3 id="featuredAnime">0</h3>

            <p>Featured Anime</p>

        </div>

    </div>

    <!-- QUICK ACTIONS -->

    <div class="panel">

        <h2>Quick Actions</h2>

        <div class="form-grid">

            <button onclick="window.location.href='admin-anime.html'" class="save-btn">
                Add Anime
            </button>

            <button onclick="window.location.href='admin-movies.html'" class="save-btn">
                Add Movie
            </button>

            <button onclick="window.location.href='admin-users.html'" class="save-btn">
                Manage Users
            </button>

            <button onclick="window.location.href='admin-settings.html'" class="save-btn">
                Website Settings
            </button>

        </div>

    </div>

    <!-- RECENT ANIME -->

    <div class="panel">

        <h2>Anime Library</h2>

        <div id="animeList"></div>

    </div>

</div>

<!-- TRAILER POPUP -->

<div class="trailer-modal" id="trailerModal">

    <div class="trailer-box">

        <span class="close-trailer" onclick="closeTrailer()">
            ×
        </span>

        <iframe id="trailerFrame" src="" allowfullscreen></iframe>

    </div>

</div>

<script src="admin.js"></script>
<script src="admin-protect.js"></script>

</body>

</html>
