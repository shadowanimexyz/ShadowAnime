<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manga Manager - Shadow Admin</title>

<link rel="stylesheet" href="admin.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  background:radial-gradient(circle at top,#08234a,#030712 55%,#01030a);
  color:#fff;
  font-family:Poppins,sans-serif;
}

.sidebar{
  background:rgba(3,10,24,.92);
  border-right:1px solid rgba(0,200,255,.25);
  box-shadow:0 0 35px rgba(0,200,255,.12);
}

.sidebar h2{
  font-family:Orbitron,sans-serif;
  color:#00c8ff;
  text-shadow:0 0 20px #00c8ff;
}

.sidebar a{
  border-radius:14px;
  margin:7px 12px;
  transition:.25s;
}

.sidebar a:hover,
.sidebar a.active{
  background:linear-gradient(135deg,#00c8ff,#fff);
  color:#00111c;
  font-weight:900;
}

.admin-hero{
  padding:28px;
  border-radius:30px;
  background:rgba(7,18,35,.78);
  border:1px solid rgba(0,200,255,.25);
  box-shadow:0 0 40px rgba(0,200,255,.13);
  margin-bottom:25px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  flex-wrap:wrap;
}

.admin-hero h1{
  font-family:Orbitron,sans-serif;
  font-size:38px;
}

.admin-hero p{
  color:#9fb4c9;
  margin-top:6px;
}

.admin-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.admin-btn,
.save-btn{
  border:none;
  padding:13px 18px;
  border-radius:15px;
  background:linear-gradient(135deg,#00c8ff,#fff);
  color:#00111c;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,200,255,.35);
}

.admin-btn.dark{
  background:rgba(255,255,255,.07);
  color:#fff;
  border:1px solid rgba(0,200,255,.25);
}

.admin-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.admin-stat-card{
  padding:22px;
  border-radius:24px;
  background:rgba(7,18,35,.78);
  border:1px solid rgba(0,200,255,.22);
  box-shadow:0 0 35px rgba(0,200,255,.1);
}

.admin-stat-card h2{
  color:#00c8ff;
  font-size:34px;
}

.admin-stat-card p{
  color:#9fb4c9;
}

.panel{
  padding:24px;
  border-radius:28px;
  background:rgba(7,18,35,.78);
  border:1px solid rgba(0,200,255,.22);
  box-shadow:0 0 35px rgba(0,200,255,.1);
  margin-bottom:25px;
}

.panel h2{
  font-family:Orbitron,sans-serif;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.form-grid textarea{
  grid-column:1/-1;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:#fff;
  outline:none;
}

textarea{
  min-height:130px;
  resize:vertical;
}

select option{
  color:#000;
}

.extra-options{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin:10px 0 18px;
}

.extra-options label{
  padding:11px 14px;
  border-radius:16px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(0,200,255,.18);
  color:#b8d8ff;
  font-weight:700;
}

.manager-tools{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.manager-tools input,
.manager-tools select{
  max-width:260px;
}

.manga-list-card{
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:12px;
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:15px;
  align-items:center;
}

.manga-list-card img{
  width:70px;
  height:95px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid rgba(0,200,255,.22);
}

.manga-list-card h3{
  margin-bottom:6px;
}

.manga-list-card p{
  color:#9fb4c9;
  font-size:13px;
}

.admin-badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}

.admin-badge{
  font-size:11px;
  padding:5px 9px;
  border-radius:20px;
  color:#00c8ff;
  background:rgba(0,200,255,.09);
  border:1px solid rgba(0,200,255,.22);
  font-weight:800;
}

.list-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.small-btn{
  border:none;
  padding:9px 11px;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(0,200,255,.22);
  color:#fff;
}

.small-btn.delete{
  border-color:rgba(255,76,106,.35);
  background:rgba(255,76,106,.13);
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:999;
  padding:14px 18px;
  border-radius:16px;
  background:#07182c;
  border:1px solid rgba(0,200,255,.3);
  box-shadow:0 0 25px rgba(0,200,255,.25);
  transform:translateY(90px);
  opacity:0;
  transition:.3s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

@media(max-width:1000px){
  .admin-stats,
  .form-grid{
    grid-template-columns:1fr;
  }

  .manga-list-card{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>SHADOW</h2>
  <a href="admin-dashboard.html">Dashboard</a>
  <a href="admin-anime.html">Anime Manager</a>
  <a href="admin-movies.html">Movies</a>
  <a class="active" href="admin-manga.html">Manga</a>
  <a href="admin-users.html">Users</a>
  <a href="admin-settings.html">Settings</a>
  <a href="admin-community.html">Community</a>
  <a href="index.html">Back To Website</a>
</div>

<div class="main">

  <div class="admin-hero">
    <div>
      <h1>Manga Manager</h1>
      <p>Manage manga titles, posters, chapters, ratings, years, read links and featured manga.</p>
    </div>

    <div class="admin-actions">
      <button class="admin-btn" onclick="document.getElementById('mangaName').focus()">+ Add Manga</button>
      <button class="admin-btn dark" onclick="exportMangaJSON()">Export JSON</button>
      <button class="admin-btn dark" onclick="clearMangaForm()">Clear Form</button>
    </div>
  </div>

  <div class="admin-stats">
    <div class="admin-stat-card">
      <h2 id="mangaTotalStat">0</h2>
      <p>Total Manga</p>
    </div>

    <div class="admin-stat-card">
      <h2 id="mangaFeaturedStat">0</h2>
      <p>Featured</p>
    </div>

    <div class="admin-stat-card">
      <h2 id="mangaRatingStat">0</h2>
      <p>With Rating</p>
    </div>

    <div class="admin-stat-card">
      <h2 id="mangaChapterStat">0</h2>
      <p>With Chapters</p>
    </div>
  </div>

  <div class="panel">
    <h2>Add / Edit Manga</h2>

    <div class="form-grid">
      <input id="mangaName" placeholder="Manga Name">
      <input id="mangaGenre" placeholder="Genre">
      <input id="mangaImage" placeholder="Poster Image Path">
      <input id="mangaRating" placeholder="Rating">
      <input id="mangaChapters" placeholder="Total Chapters">
      <input id="mangaYear" placeholder="Release Year">
      <input id="mangaRead" placeholder="Read Manga URL">
      <input id="mangaAuthor" placeholder="Author / Artist">
      <textarea id="mangaDesc" placeholder="Manga Description"></textarea>
    </div>

    <div class="extra-options">
      <label><input type="checkbox" id="mangaFeatured"> Featured</label>
      <label><input type="checkbox" id="mangaTrending"> Trending</label>
      <label><input type="checkbox" id="mangaPopular"> Popular</label>
    </div>

    <button onclick="saveMangaPro()" class="save-btn" id="saveMangaBtn">
      Save Manga 📚
    </button>
  </div>

  <div class="panel">
    <h2>Manga Library</h2>

    <div class="manager-tools">
      <input id="mangaAdminSearch" placeholder="Search manga...">

      <select id="mangaAdminFilter">
        <option value="all">All Manga</option>
        <option value="featured">Featured</option>
        <option value="trending">Trending</option>
        <option value="popular">Popular</option>
        <option value="rating">With Rating</option>
      </select>
    </div>

    <div id="mangaList"></div>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

<script>
let mangaLibrary = JSON.parse(localStorage.getItem("adminMangaLibrary")) || [];
let editMangaIndex = null;

function showToast(text){
  toast.innerText = text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1800);
}

async function loadExistingManga(){
  if(mangaLibrary.length){
    renderMangaList();
    updateMangaStats();
    return;
  }

  try{
    const res = await fetch("manga.json?v=" + Date.now());
    const data = await res.json();

    if(Array.isArray(data)){
      mangaLibrary = data.map(item => ({
        title:item.title || item.name || "",
        name:item.name || item.title || "",
        genre:item.genre || item.category || "",
        image:item.image || "",
        rating:item.rating || "",
        chapters:item.chapters || item.chapter || "",
        year:item.year || "",
        link:item.link || item.read || "",
        read:item.read || item.link || "",
        author:item.author || "",
        desc:item.desc || item.description || "",
        description:item.description || item.desc || "",
        featured:item.featured || false,
        trending:item.trending || false,
        popular:item.popular || false,
        type:"Manga"
      }));

      saveMangaLibrary();
    }
  }catch{}

  renderMangaList();
  updateMangaStats();
}

function saveMangaLibrary(){
  localStorage.setItem("adminMangaLibrary", JSON.stringify(mangaLibrary));
  localStorage.setItem("totalManga", mangaLibrary.length);
}

function val(id){
  return document.getElementById(id).value.trim();
}

function saveMangaPro(){
  const manga = {
    title: val("mangaName"),
    name: val("mangaName"),
    genre: val("mangaGenre"),
    category: val("mangaGenre"),
    image: val("mangaImage"),
    rating: val("mangaRating"),
    chapters: val("mangaChapters"),
    chapter: val("mangaChapters"),
    year: val("mangaYear"),
    read: val("mangaRead"),
    link: val("mangaRead"),
    author: val("mangaAuthor"),
    desc: val("mangaDesc"),
    description: val("mangaDesc"),
    featured: mangaFeatured.checked,
    trending: mangaTrending.checked,
    popular: mangaPopular.checked,
    type: "Manga"
  };

  if(!manga.title || !manga.image){
    showToast("Manga name and poster required");
    return;
  }

  if(editMangaIndex !== null){
    mangaLibrary[editMangaIndex] = manga;
    editMangaIndex = null;
    saveMangaBtn.innerText = "Save Manga 📚";
  }else{
    mangaLibrary.unshift(manga);
  }

  saveMangaLibrary();
  clearMangaForm();
  renderMangaList();
  updateMangaStats();
  showToast("Manga saved");
}

function clearMangaForm(){
  [
    mangaName,mangaGenre,mangaImage,mangaRating,
    mangaChapters,mangaYear,mangaRead,mangaAuthor,mangaDesc
  ].forEach(input=>input.value="");

  mangaFeatured.checked=false;
  mangaTrending.checked=false;
  mangaPopular.checked=false;

  editMangaIndex = null;
  saveMangaBtn.innerText = "Save Manga 📚";
}

function editManga(index){
  const manga = mangaLibrary[index];

  mangaName.value = manga.title || manga.name || "";
  mangaGenre.value = manga.genre || manga.category || "";
  mangaImage.value = manga.image || "";
  mangaRating.value = manga.rating || "";
  mangaChapters.value = manga.chapters || manga.chapter || "";
  mangaYear.value = manga.year || "";
  mangaRead.value = manga.read || manga.link || "";
  mangaAuthor.value = manga.author || "";
  mangaDesc.value = manga.desc || manga.description || "";

  mangaFeatured.checked = !!manga.featured;
  mangaTrending.checked = !!manga.trending;
  mangaPopular.checked = !!manga.popular;

  editMangaIndex = index;
  saveMangaBtn.innerText = "Update Manga";

  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteManga(index){
  if(confirm("Delete this manga?")){
    mangaLibrary.splice(index,1);
    saveMangaLibrary();
    renderMangaList();
    updateMangaStats();
    showToast("Manga deleted");
  }
}

function renderMangaList(){
  const keyword = mangaAdminSearch.value.toLowerCase().trim();
  const filter = mangaAdminFilter.value;

  let list = mangaLibrary.filter(manga=>{
    const text = `${manga.title} ${manga.genre} ${manga.year} ${manga.rating} ${manga.chapters}`.toLowerCase();

    const matchSearch = text.includes(keyword);

    const matchFilter =
      filter === "all" ||
      (filter === "featured" && manga.featured) ||
      (filter === "trending" && manga.trending) ||
      (filter === "popular" && manga.popular) ||
      (filter === "rating" && manga.rating);

    return matchSearch && matchFilter;
  });

  mangaList.innerHTML = list.length ? list.map(manga=>{
    const realIndex = mangaLibrary.indexOf(manga);

    return `
      <div class="manga-list-card">
        <img src="${manga.image}" onerror="this.src='image/bg.jpg'">

        <div>
          <h3>${manga.title || manga.name}</h3>
          <p>${manga.genre || "Manga"} · ${manga.chapters || "Chapters"} · ${manga.year || "Year"}</p>

          <div class="admin-badges">
            ${manga.featured ? `<span class="admin-badge">Featured</span>` : ""}
            ${manga.trending ? `<span class="admin-badge">Trending</span>` : ""}
            ${manga.popular ? `<span class="admin-badge">Popular</span>` : ""}
            ${manga.rating ? `<span class="admin-badge">⭐ ${manga.rating}</span>` : ""}
          </div>
        </div>

        <div class="list-actions">
          <button class="small-btn" onclick="editManga(${realIndex})">Edit</button>
          <button class="small-btn delete" onclick="deleteManga(${realIndex})">Delete</button>
        </div>
      </div>
    `;
  }).join("") : `<p style="color:#9fb4c9;">No manga found.</p>`;
}

function updateMangaStats(){
  mangaTotalStat.innerText = mangaLibrary.length;
  mangaFeaturedStat.innerText = mangaLibrary.filter(m=>m.featured).length;
  mangaRatingStat.innerText = mangaLibrary.filter(m=>m.rating).length;
  mangaChapterStat.innerText = mangaLibrary.filter(m=>m.chapters || m.chapter).length;
}

function exportMangaJSON(){
  const exportData = mangaLibrary.map(manga => ({
    title: manga.title || manga.name,
    name: manga.title || manga.name,
    genre: manga.genre,
    category: manga.genre,
    image: manga.image,
    rating: manga.rating,
    chapters: manga.chapters,
    chapter: manga.chapters,
    year: manga.year,
    read: manga.read || manga.link,
    link: manga.read || manga.link,
    author: manga.author,
    description: manga.desc || manga.description,
    featured: manga.featured,
    trending: manga.trending,
    popular: manga.popular,
    type: "Manga"
  }));

  const blob = new Blob([JSON.stringify(exportData,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "manga.json";
  a.click();
  URL.revokeObjectURL(a.href);

  showToast("manga.json exported");
}

mangaAdminSearch.addEventListener("input", renderMangaList);
mangaAdminFilter.addEventListener("change", renderMangaList);

loadExistingManga();
</script>

<script src="admin.js"></script>
<script src="admin-protect.js"></script>

</body>
</html>
