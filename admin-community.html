<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadow Admin - Community Manager</title>

<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:
    radial-gradient(circle at top,#08234a,#030712 55%,#01030a);
    color:white;
    font-family:Poppins,sans-serif;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    min-height:100vh;
    background:rgba(3,10,24,.94);
    border-right:1px solid rgba(0,200,255,.22);
    box-shadow:0 0 35px rgba(0,200,255,.12);
    position:fixed;
    left:0;
    top:0;
    overflow:auto;
}

.sidebar h2{
    text-align:center;
    padding:30px 10px;
    color:#00c8ff;
    font-family:Orbitron,sans-serif;
    letter-spacing:2px;
    text-shadow:0 0 20px #00c8ff;
}

.sidebar a{
    display:block;
    margin:8px 14px;
    padding:14px 16px;
    border-radius:14px;
    text-decoration:none;
    color:#d7e7ff;
    transition:.25s;
    font-weight:600;
}

.sidebar a:hover,
.sidebar a.active{
    background:
    linear-gradient(135deg,#00c8ff,#ffffff);
    color:#00111c;
    font-weight:900;
}

/* MAIN */

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:30px;
}

/* HERO */

.community-hero{
    padding:35px;
    border-radius:30px;
    background:
    linear-gradient(135deg,
    rgba(0,200,255,.16),
    rgba(138,44,255,.10));
    border:1px solid rgba(0,200,255,.24);
    box-shadow:0 0 45px rgba(0,200,255,.15);
    margin-bottom:25px;
}

.community-hero h1{
    margin:0;
    font-size:42px;
    font-family:Orbitron,sans-serif;
    text-shadow:0 0 20px #00c8ff;
}

.community-hero p{
    color:#9fb4c9;
    margin-top:8px;
}

/* BUTTONS */

.top-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:22px;
}

.admin-btn{
    border:none;
    padding:13px 20px;
    border-radius:16px;
    background:
    linear-gradient(135deg,#00c8ff,#ffffff);
    color:#00111c;
    font-weight:900;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 0 25px rgba(0,200,255,.35);
}

.admin-btn:hover{
    transform:translateY(-3px);
}

.admin-btn.red{
    background:
    linear-gradient(135deg,#ff3d6e,#ff7b9c);
    color:white;
}

.admin-btn.dark{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(0,200,255,.2);
    color:white;
}

/* STATS */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    padding:22px;
    border-radius:24px;
    background:rgba(7,18,35,.82);
    border:1px solid rgba(0,200,255,.18);
    box-shadow:0 0 30px rgba(0,200,255,.10);
}

.stat-card h2{
    margin:0;
    font-size:38px;
    color:#00c8ff;
}

.stat-card p{
    color:#9fb4c9;
    margin-top:8px;
}

/* PANEL */

.panel{
    padding:25px;
    border-radius:28px;
    background:rgba(7,18,35,.82);
    border:1px solid rgba(0,200,255,.18);
    box-shadow:0 0 35px rgba(0,200,255,.10);
    margin-bottom:25px;
}

.panel h2{
    margin-top:0;
    font-family:Orbitron,sans-serif;
}

/* TOOLS */

.community-tools{
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.community-tools input,
.community-tools select{
    padding:14px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.06);
    color:white;
    outline:none;
    min-width:220px;
}

.community-tools option{
    color:black;
}

/* POSTS */

.community-post{
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:18px;
}

.community-post.pinned{
    border-color:rgba(255,211,105,.5);
    box-shadow:0 0 25px rgba(255,211,105,.12);
}

.post-left h3{
    margin:0 0 10px;
}

.post-left p{
    color:#c8d8ef;
    line-height:1.7;
}

.post-meta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
}

.meta-tag{
    padding:6px 10px;
    border-radius:20px;
    background:rgba(0,200,255,.08);
    border:1px solid rgba(0,200,255,.25);
    color:#00c8ff;
    font-size:11px;
    font-weight:800;
}

.meta-tag.red{
    color:#ff4c6a;
    border-color:rgba(255,76,106,.3);
    background:rgba(255,76,106,.08);
}

.meta-tag.yellow{
    color:#ffd369;
    border-color:rgba(255,211,105,.3);
    background:rgba(255,211,105,.08);
}

.post-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.small-btn{
    border:none;
    padding:10px 14px;
    border-radius:14px;
    cursor:pointer;
    font-weight:800;
    background:rgba(255,255,255,.08);
    color:white;
    border:1px solid rgba(0,200,255,.18);
}

.small-btn.delete{
    background:rgba(255,76,106,.12);
    border-color:rgba(255,76,106,.28);
}

/* POLLS */

.poll-card{
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
}

.poll-option{
    margin-top:10px;
    padding:12px;
    border-radius:14px;
    background:rgba(0,200,255,.08);
    display:flex;
    justify-content:space-between;
    color:#c8eaff;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    padding:14px 18px;
    border-radius:16px;
    background:#07182c;
    border:1px solid rgba(0,200,255,.3);
    box-shadow:0 0 25px rgba(0,200,255,.25);
    transform:translateY(90px);
    opacity:0;
    transition:.3s;
    z-index:999;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .community-post{
        grid-template-columns:1fr;
    }

    .post-actions{
        flex-direction:row;
        flex-wrap:wrap;
    }

}

@media(max-width:800px){

    .sidebar{
        width:100%;
        min-height:auto;
        position:relative;
    }

    .main{
        margin-left:0;
        width:100%;
    }

}

@media(max-width:650px){

    .stats-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>SHADOW</h2>

    <a href="admin-dashboard.html">Dashboard</a>

    <a href="admin-anime.html">Anime Manager</a>

    <a href="admin-movies.html">Movies</a>

    <a href="admin-manga.html">Manga</a>

    <a href="admin-community.html" class="active">Community</a>

    <a href="admin-users.html">Users</a>

    <a href="admin-settings.html">Settings</a>

    <a href="index.html">Back To Website</a>

</div>

<!-- MAIN -->

<div class="main">

    <!-- HERO -->

    <div class="community-hero">

        <h1>Community Manager</h1>

        <p>
            Control posts, spoilers, polls, reactions,
            community reports and moderation tools.
        </p>

        <div class="top-actions">

            <button class="admin-btn"
            onclick="exportCommunityData()">
                Export Community
            </button>

            <button class="admin-btn dark"
            onclick="window.location.href='community.html'">
                Open Community
            </button>

            <button class="admin-btn red"
            onclick="clearCommunityPosts()">
                Clear All Posts
            </button>

        </div>

    </div>

    <!-- STATS -->

    <div class="stats-grid">

        <div class="stat-card">
            <h2 id="totalPosts">0</h2>
            <p>Total Posts</p>
        </div>

        <div class="stat-card">
            <h2 id="totalReviews">0</h2>
            <p>Reviews</p>
        </div>

        <div class="stat-card">
            <h2 id="totalRequests">0</h2>
            <p>Requests</p>
        </div>

        <div class="stat-card">
            <h2 id="totalPolls">0</h2>
            <p>Polls</p>
        </div>

    </div>

    <!-- POSTS -->

    <div class="panel">

        <h2>Community Posts</h2>

        <div class="community-tools">

            <input type="text"
            id="communitySearch"
            placeholder="Search community posts...">

            <select id="communityFilter">

                <option value="all">All Posts</option>

                <option value="review">Reviews</option>

                <option value="request">Requests</option>

                <option value="spoiler">Spoilers</option>

                <option value="pinned">Pinned</option>

            </select>

        </div>

        <div id="adminCommunityList"></div>

    </div>

    <!-- POLLS -->

    <div class="panel">

        <h2>Poll Manager</h2>

        <div id="pollList"></div>

    </div>

</div>

<div class="toast" id="toast">
    Saved
</div>

<script>

let communityPosts =
JSON.parse(localStorage.getItem("communityPostsUltra")) || [];

let communityPolls =
JSON.parse(localStorage.getItem("communityPolls")) || [];

/* TOAST */

function showToast(text){

    toast.innerText = text;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },1800);

}

/* SAVE */

function savePosts(){

    localStorage.setItem(
        "communityPostsUltra",
        JSON.stringify(communityPosts)
    );

}

function savePolls(){

    localStorage.setItem(
        "communityPolls",
        JSON.stringify(communityPolls)
    );

}

/* RENDER POSTS */

function renderCommunityPosts(){

    const keyword =
    communitySearch.value.toLowerCase().trim();

    const filter =
    communityFilter.value;

    let filtered =
    communityPosts.filter(post=>{

        const text = `
            ${post.title || ""}
            ${post.message || ""}
            ${post.type || ""}
            ${post.name || ""}
        `.toLowerCase();

        const matchSearch =
        text.includes(keyword);

        const matchFilter =
            filter === "all" ||

            (filter === "review" &&
            (post.type || "").toLowerCase().includes("review")) ||

            (filter === "request" &&
            (post.type || "").toLowerCase().includes("request")) ||

            (filter === "spoiler" &&
            post.spoiler) ||

            (filter === "pinned" &&
            post.pinned);

        return matchSearch && matchFilter;

    });

    adminCommunityList.innerHTML =
    filtered.length ?

    filtered.map(post=>{

        const realIndex =
        communityPosts.indexOf(post);

        return `

        <div class="community-post ${post.pinned ? "pinned" : ""}">

            <div class="post-left">

                <h3>
                    ${post.title || "Community Post"}
                </h3>

                <p>
                    ${post.message || ""}
                </p>

                <div class="post-meta">

                    <span class="meta-tag">
                        ${post.type || "Post"}
                    </span>

                    <span class="meta-tag">
                        👤 ${post.name || "User"}
                    </span>

                    <span class="meta-tag">
                        ❤️ ${post.likes || 0}
                    </span>

                    <span class="meta-tag">
                        🔥 ${post.fire || 0}
                    </span>

                    <span class="meta-tag">
                        💬 ${(post.replies || []).length}
                    </span>

                    ${post.pinned ?
                    `<span class="meta-tag yellow">
                        PINNED
                    </span>` : ""}

                    ${post.spoiler ?
                    `<span class="meta-tag red">
                        SPOILER
                    </span>` : ""}

                </div>

            </div>

            <div class="post-actions">

                <button class="small-btn"
                onclick="togglePin(${realIndex})">

                    ${post.pinned ? "Unpin" : "Pin"}

                </button>

                <button class="small-btn"
                onclick="toggleSpoiler(${realIndex})">

                    ${post.spoiler ?
                    "Remove Spoiler" :
                    "Mark Spoiler"}

                </button>

                <button class="small-btn"
                onclick="resetReactions(${realIndex})">

                    Reset Reactions

                </button>

                <button class="small-btn delete"
                onclick="deletePost(${realIndex})">

                    Delete

                </button>

            </div>

        </div>

        `;

    }).join("")

    :

    `<p style="color:#9fb4c9;">
        No community posts found.
    </p>`;

    updateStats();

}

/* POLLS */

function renderPolls(){

    pollList.innerHTML =
    communityPolls.length ?

    communityPolls.map(poll=>{

        const index =
        communityPolls.indexOf(poll);

        return `

        <div class="poll-card">

            <h3>
                ${poll.question}
            </h3>

            ${(poll.options || []).map(option=>`

                <div class="poll-option">

                    <span>
                        ${option.name}
                    </span>

                    <b>
                        ${option.votes || 0} votes
                    </b>

                </div>

            `).join("")}

            <br>

            <button class="small-btn delete"
            onclick="deletePoll(${index})">

                Delete Poll

            </button>

        </div>

        `;

    }).join("")

    :

    `<p style="color:#9fb4c9;">
        No polls found.
    </p>`;

}

/* STATS */

function updateStats(){

    totalPosts.innerText =
    communityPosts.length;

    totalReviews.innerText =
    communityPosts.filter(post=>
    (post.type || "")
    .toLowerCase()
    .includes("review")).length;

    totalRequests.innerText =
    communityPosts.filter(post=>
    (post.type || "")
    .toLowerCase()
    .includes("request")).length;

    totalPolls.innerText =
    communityPolls.length;

}

/* ACTIONS */

function togglePin(index){

    communityPosts[index].pinned =
    !communityPosts[index].pinned;

    savePosts();

    renderCommunityPosts();

    showToast("Post Updated");

}

function toggleSpoiler(index){

    communityPosts[index].spoiler =
    !communityPosts[index].spoiler;

    savePosts();

    renderCommunityPosts();

    showToast("Spoiler Updated");

}

function resetReactions(index){

    if(confirm("Reset reactions?")){

        communityPosts[index].likes = 0;
        communityPosts[index].fire = 0;

        savePosts();

        renderCommunityPosts();

        showToast("Reactions Reset");

    }

}

function deletePost(index){

    if(confirm("Delete post?")){

        communityPosts.splice(index,1);

        savePosts();

        renderCommunityPosts();

        showToast("Post Deleted");

    }

}

function deletePoll(index){

    if(confirm("Delete poll?")){

        communityPolls.splice(index,1);

        savePolls();

        renderPolls();

        updateStats();

        showToast("Poll Deleted");

    }

}

function clearCommunityPosts(){

    if(confirm("Delete all posts?")){

        communityPosts = [];

        savePosts();

        renderCommunityPosts();

        showToast("All Posts Deleted");

    }

}

/* EXPORT */

function exportCommunityData(){

    const data = {
        posts:communityPosts,
        polls:communityPolls
    };

    const blob =
    new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"});

    const a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    "shadow-community-backup.json";

    a.click();

    URL.revokeObjectURL(a.href);

    showToast("Community Exported");

}

/* EVENTS */

communitySearch.addEventListener(
"input",
renderCommunityPosts
);

communityFilter.addEventListener(
"change",
renderCommunityPosts
);

/* LOAD */

renderCommunityPosts();

renderPolls();

updateStats();

</script>

<script src="admin.js"></script>

<script src="admin-protect.js"></script>

</body>
</html>
