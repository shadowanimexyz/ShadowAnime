    <input id="userEmail" placeholder="Email">

    <input id="userAvatar" placeholder="Profile Image URL">

    <input id="userPlan" placeholder="Subscription Plan">

    <select id="userRole">

        <option>Normal User</option>
        <option>Premium User</option>
        <option>Moderator</option>
        <option>Admin</option>

    </select>

    <button onclick="addUser()" class="save-btn">
        Save User
    </button>

        <h2>User List</h2>
        <div id="userList"></div>
