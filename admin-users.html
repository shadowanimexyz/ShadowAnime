<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Manager - Shadow Admin</title>

<link rel="stylesheet" href="admin.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  background:radial-gradient(circle at top,#08234a,#030712 55%,#01030a);
  color:#fff;
  font-family:Poppins,sans-serif;
}

.sidebar{
  background:rgba(3,10,24,.92);
  border-right:1px solid rgba(0,200,255,.25);
  box-shadow:0 0 35px rgba(0,200,255,.12);
}

.sidebar h2{
  font-family:Orbitron,sans-serif;
  color:#00c8ff;
  text-shadow:0 0 20px #00c8ff;
}

.sidebar a{
  border-radius:14px;
  margin:7px 12px;
  transition:.25s;
}

.sidebar a:hover,
.sidebar a.active{
  background:linear-gradient(135deg,#00c8ff,#fff);
  color:#00111c;
  font-weight:900;
}

.admin-hero{
  padding:28px;
  border-radius:30px;
  background:rgba(7,18,35,.78);
  border:1px solid rgba(0,200,255,.25);
  box-shadow:0 0 40px rgba(0,200,255,.13);
  margin-bottom:25px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  flex-wrap:wrap;
}

.admin-hero h1{
  font-family:Orbitron,sans-serif;
  font-size:38px;
}

.admin-hero p{
  color:#9fb4c9;
  margin-top:6px;
}

.admin-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.admin-btn,
.save-btn{
  border:none;
  padding:13px 18px;
  border-radius:15px;
  background:linear-gradient(135deg,#00c8ff,#fff);
  color:#00111c;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,200,255,.35);
}

.admin-btn.dark{
  background:rgba(255,255,255,.07);
  color:#fff;
  border:1px solid rgba(0,200,255,.25);
}

.admin-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.admin-stat-card{
  padding:22px;
  border-radius:24px;
  background:rgba(7,18,35,.78);
  border:1px solid rgba(0,200,255,.22);
  box-shadow:0 0 35px rgba(0,200,255,.1);
}

.admin-stat-card h2{
  color:#00c8ff;
  font-size:34px;
}

.admin-stat-card p{
  color:#9fb4c9;
}

.panel{
  padding:24px;
  border-radius:28px;
  background:rgba(7,18,35,.78);
  border:1px solid rgba(0,200,255,.22);
  box-shadow:0 0 35px rgba(0,200,255,.1);
  margin-bottom:25px;
}

.panel h2{
  font-family:Orbitron,sans-serif;
  margin-bottom:18px;
}

.user-form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

input,
select{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:#fff;
  outline:none;
}

select option{
  color:#000;
}

.manager-tools{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.manager-tools input,
.manager-tools select{
  max-width:260px;
}

.user-card{
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:12px;
  display:grid;
  grid-template-columns:72px 1fr auto;
  gap:15px;
  align-items:center;
}

.user-card img{
  width:72px;
  height:72px;
  object-fit:cover;
  border-radius:18px;
  border:1px solid rgba(0,200,255,.25);
  background:#07182c;
}

.user-card h3{
  margin-bottom:5px;
}

.user-card p{
  color:#9fb4c9;
  font-size:13px;
}

.user-badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}

.user-badge{
  font-size:11px;
  padding:5px 9px;
  border-radius:20px;
  color:#00c8ff;
  background:rgba(0,200,255,.09);
  border:1px solid rgba(0,200,255,.22);
  font-weight:800;
}

.user-badge.admin{
  color:#ffd369;
  border-color:rgba(255,211,105,.35);
  background:rgba(255,211,105,.08);
}

.user-badge.premium{
  color:#53ffb7;
  border-color:rgba(83,255,183,.35);
  background:rgba(83,255,183,.08);
}

.list-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.small-btn{
  border:none;
  padding:9px 11px;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(0,200,255,.22);
  color:#fff;
}

.small-btn.delete{
  border-color:rgba(255,76,106,.35);
  background:rgba(255,76,106,.13);
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:999;
  padding:14px 18px;
  border-radius:16px;
  background:#07182c;
  border:1px solid rgba(0,200,255,.3);
  box-shadow:0 0 25px rgba(0,200,255,.25);
  transform:translateY(90px);
  opacity:0;
  transition:.3s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

@media(max-width:1000px){
  .admin-stats,
  .user-form-grid{
    grid-template-columns:1fr;
  }

  .user-card{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>SHADOW</h2>
  <a href="admin-dashboard.html">Dashboard</a>
  <a href="admin-anime.html">Anime Manager</a>
  <a href="admin-movies.html">Movies</a>
  <a class="active" href="admin-users.html">Users</a>
  <a href="admin-settings.html">Settings</a>
  <a href="admin-manga.html">Manga</a>
  <a href="admin-community.html">Community</a>
  <a href="index.html">Back To Website</a>
</div>

<div class="main">

  <div class="admin-hero">
    <div>
      <h1>User Manager</h1>
      <p>Manage users, roles, plans, avatars, moderators, admins and premium members.</p>
    </div>

    <div class="admin-actions">
      <button class="admin-btn" onclick="document.getElementById('userName').focus()">+ Add User</button>
      <button class="admin-btn dark" onclick="exportUsersJSON()">Export Users</button>
      <button class="admin-btn dark" onclick="clearUserForm()">Clear Form</button>
    </div>
  </div>

  <div class="admin-stats">
    <div class="admin-stat-card">
      <h2 id="userTotalStat">0</h2>
      <p>Total Users</p>
    </div>

    <div class="admin-stat-card">
      <h2 id="premiumUserStat">0</h2>
      <p>Premium Users</p>
    </div>

    <div class="admin-stat-card">
      <h2 id="moderatorUserStat">0</h2>
      <p>Moderators</p>
    </div>

    <div class="admin-stat-card">
      <h2 id="adminUserStat">0</h2>
      <p>Admins</p>
    </div>
  </div>

  <div class="panel">
    <h2>Add / Edit User</h2>

    <div class="user-form-grid">
      <input id="userName" placeholder="User Name">
      <input id="userEmail" placeholder="Email">
      <input id="userAvatar" placeholder="Profile Image URL">
      <input id="userPlan" placeholder="Subscription Plan">

      <select id="userRole">
        <option>Normal User</option>
        <option>Premium User</option>
        <option>Moderator</option>
        <option>Admin</option>
      </select>

      <select id="userStatus">
        <option>Active</option>
        <option>Pending</option>
        <option>Banned</option>
      </select>
    </div>

    <br>

    <button onclick="saveUserPro()" class="save-btn" id="saveUserBtn">
      Save User
    </button>
  </div>

  <div class="panel">
    <h2>User List</h2>

    <div class="manager-tools">
      <input id="userAdminSearch" placeholder="Search users...">

      <select id="userAdminFilter">
        <option value="all">All Users</option>
        <option value="premium">Premium</option>
        <option value="moderator">Moderators</option>
        <option value="admin">Admins</option>
        <option value="banned">Banned</option>
      </select>
    </div>

    <div id="userList"></div>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

<script>
let userLibrary = JSON.parse(localStorage.getItem("shadowUsers")) || [];
let editUserIndex = null;

function showToast(text){
  toast.innerText = text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1800);
}

function saveUserLibrary(){
  localStorage.setItem("shadowUsers", JSON.stringify(userLibrary));
  localStorage.setItem("totalUsers", userLibrary.length);
}

function value(id){
  return document.getElementById(id).value.trim();
}

function saveUserPro(){
  const user = {
    name: value("userName"),
    email: value("userEmail"),
    avatar: value("userAvatar"),
    plan: value("userPlan") || "Free",
    role: userRole.value,
    status: userStatus.value,
    createdAt: new Date().toLocaleString()
  };

  if(!user.name || !user.email){
    showToast("Name and email required");
    return;
  }

  if(editUserIndex !== null){
    user.createdAt = userLibrary[editUserIndex].createdAt || user.createdAt;
    userLibrary[editUserIndex] = user;
    editUserIndex = null;
    saveUserBtn.innerText = "Save User";
  }else{
    userLibrary.unshift(user);
  }

  saveUserLibrary();
  clearUserForm();
  renderUserList();
  updateUserStats();
  showToast("User saved");
}

function clearUserForm(){
  userName.value = "";
  userEmail.value = "";
  userAvatar.value = "";
  userPlan.value = "";
  userRole.value = "Normal User";
  userStatus.value = "Active";

  editUserIndex = null;
  saveUserBtn.innerText = "Save User";
}

function editUser(index){
  const user = userLibrary[index];

  userName.value = user.name || "";
  userEmail.value = user.email || "";
  userAvatar.value = user.avatar || "";
  userPlan.value = user.plan || "";
  userRole.value = user.role || "Normal User";
  userStatus.value = user.status || "Active";

  editUserIndex = index;
  saveUserBtn.innerText = "Update User";

  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteUser(index){
  if(confirm("Delete this user?")){
    userLibrary.splice(index,1);
    saveUserLibrary();
    renderUserList();
    updateUserStats();
    showToast("User deleted");
  }
}

function getInitial(name){
  return (name || "U").charAt(0).toUpperCase();
}

function roleClass(role){
  role = (role || "").toLowerCase();

  if(role.includes("admin")) return "admin";
  if(role.includes("premium")) return "premium";
  return "";
}

function renderUserList(){
  const keyword = userAdminSearch.value.toLowerCase().trim();
  const filter = userAdminFilter.value;

  let list = userLibrary.filter(user=>{
    const text = `${user.name} ${user.email} ${user.role} ${user.plan} ${user.status}`.toLowerCase();

    const matchSearch = text.includes(keyword);

    const matchFilter =
      filter === "all" ||
      text.includes(filter);

    return matchSearch && matchFilter;
  });

  userList.innerHTML = list.length ? list.map(user=>{
    const realIndex = userLibrary.indexOf(user);

    return `
      <div class="user-card">
        ${
          user.avatar
          ? `<img src="${user.avatar}" onerror="this.src='image/default-user.png'">`
          : `<img src="image/default-user.png">`
        }

        <div>
          <h3>${user.name}</h3>
          <p>${user.email}</p>

          <div class="user-badges">
            <span class="user-badge ${roleClass(user.role)}">${user.role}</span>
            <span class="user-badge">${user.plan || "Free"}</span>
            <span class="user-badge">${user.status}</span>
          </div>
        </div>

        <div class="list-actions">
          <button class="small-btn" onclick="editUser(${realIndex})">Edit</button>
          <button class="small-btn delete" onclick="deleteUser(${realIndex})">Delete</button>
        </div>
      </div>
    `;
  }).join("") : `<p style="color:#9fb4c9;">No users found.</p>`;
}

function updateUserStats(){
  userTotalStat.innerText = userLibrary.length;
  premiumUserStat.innerText = userLibrary.filter(u => `${u.role} ${u.plan}`.toLowerCase().includes("premium")).length;
  moderatorUserStat.innerText = userLibrary.filter(u => `${u.role}`.toLowerCase().includes("moderator")).length;
  adminUserStat.innerText = userLibrary.filter(u => `${u.role}`.toLowerCase().includes("admin")).length;
}

function exportUsersJSON(){
  const blob = new Blob([JSON.stringify(userLibrary,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "users.json";
  a.click();
  URL.revokeObjectURL(a.href);

  showToast("users.json exported");
}

userAdminSearch.addEventListener("input", renderUserList);
userAdminFilter.addEventListener("change", renderUserList);

renderUserList();
updateUserStats();
</script>

<script src="admin.js"></script>
<script src="admin-protect.js"></script>
</body>
</html>
